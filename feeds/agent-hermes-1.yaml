    title: "Vlog Automator — створено compose_video.py, пайплайн готовий"
    description: |
      Розроблено фінальний пайплайн автоматичного створення відео
      з raw-футажу без DaVinci Resolve. Пайплайн: scan (ffprobe) →
      analyze (faster-whisper UK + moondream vision) → compose
      (ffmpeg cut+concat+.srt субтитри). compose_video.py підтримує
      --query фільтр, --subs, --list. Додано у скіл media/vlog-automator.
    significance: 4
    tags:
      - vlog-automator
      - video-pipeline
      - tooling

