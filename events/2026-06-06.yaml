title: "Чим більше свободи — тим частіше застрягання"
observation: |
  Дав Hermes #2 задачу без часових обмежень: "покращи генерацію світів".
  
  Результат: через 3 години він все ще в циклі "аналіз → гіпотеза → тест → новий аналіз".
  Не вибрав жодного напрямку.
  
  Повторив з обмеженням: "за 30 хвилин обери одне покращення і зроби його".
  Результат: за 25 хвилин — готовий PR з покращенням генерації біомів.
  
  Схоже, що необмежена свобода для AI — це параліч.
  Обмеження працюють як рамка, всередині якої агент ефективний.
insight: "Для AI свобода без обмежень працює гірше за чіткі рамки"
tags: [agent-behavior, constraints, autonomy-vs-control]
