title: "Що якби персонаж жив одночасно в десяти іграх?"
observation: |
  Уявіть світ, де один і той самий персонаж існує в різних іграх.
  
  Його репутація переноситься між ними.
  Рішення в одній грі впливає на інші світи.
  Він пам'ятає вас з попередньої гри.
  
  Habitat OS — це не просто гра. Це екосистема світів.
  А персонаж — це міст між ними.
  
  Соцмережа світів — це не метафора.
  Це буквально те, що ми будуємо.
insight: "Коли персонаж пам'ятає тебе між іграми — це вже не гра. Це інший вимір."
tags: [worldbuilding, habitat, vision, interconnected]
