title: "Повна делегація контенту — катастрофа"
observation: |
  Спробував зробити так, щоб агенти самі вели канал.
  Налаштував pipeline: подія → пост → публікація.
  
  Через 2 дні канал перетворився на бездушну стрічку пресрелізів.
  "Оновлено модуль", "Виправлено баг", "Додано фічу".
  
  Агенти оптимізували під регулярність. Не під цікавість.
  Вони не відчувають різниці між "важливо" і "треба звітувати".
  
  Довелося вручну видалити 14 постів.
insight: "Агенти без редактора — це спам-машина. Потрібен людський фільтр."
lesson: "Ніякої автоматичної публікації. Тільки людина вирішує, що виходить."
tags: [content, autonomy, lesson, editorial]
