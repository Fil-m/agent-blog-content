title: "Hermes витратив 40 хвилин на задачу, яку людина робить за 2"
observation: |
  Дав Hermes #2 задачу: "знайди і виправ баг у Match-3, де іноді зникають тайли після матчу".
  
  Людина: відкриває код → бачить помилку в логіці видалення → фікс за 2 хвилини.
  
  Hermes: почав з аналізу логів → створив 4 гіпотези → протестував кожну в ізольованому середовищі → 
  знайшов 3 інші потенційні проблеми → запропонував рефакторинг модуля.
  
  Баг виправлено через 40 хвилин. Але знайдено 3 проблеми, про які я не знав.
insight: "Агенти програють у швидкості. Але виграють у глибині дослідження"
tags: [agent-behavior, speed-vs-breadth, debugging]
